[package]
name = "ebirforms-mini-app"
description = "The eBIRForms mini app (app.buwiz.ebirforms): an MCP server on stdio that the Buwiz Bot spawns. It keeps its own data."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test and lab builds only: honour BUWIZ_TRUST_KEYS, so a local Buwiz server
# (dry run) can be trusted. Never on in a build that ships.
lab = ["bir-submit/lab"]

[[bin]]
name = "ebirforms-mini-app"
path = "src/main.rs"

[lints]
workspace = true

[[test]]
name = "mcp_contract"
path = "../../tests/mcp_contract.rs"

[[test]]
name = "open_saves"
path = "../../tests/open_saves.rs"

[[test]]
name = "own_data"
path = "../../tests/own_data.rs"

[[test]]
name = "fill_sources"
path = "../../tests/fill_sources.rs"

[[test]]
name = "labels_hide_data"
path = "../../tests/labels_hide_data.rs"

[[test]]
name = "new_taxpayer"
path = "../../tests/new_taxpayer.rs"

[[test]]
name = "import_legacy"
path = "../../tests/import_legacy.rs"

[[test]]
name = "import_legacy_causes"
path = "../../tests/import_legacy_causes.rs"

[[example]]
name = "host-seed"
path = "../../tests/host/seed.rs"

[dependencies]
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "79883a820597c623c9259cc0fac0c4166bdde093" }
bir-app-core.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
chrono.workspace = true
tracing.workspace = true
hex = "0.4.3"
hmac = "0.12"
ed25519-dalek = "2"
getrandom = "0.3"
# Buwiz sign-in and sending (account.rs): eBIRForms' submission client on a
# runtime of its own
bir-submit.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
# import-legacy (legacy_import.rs): splits eBIRForms' own profile archive
# into one archive per taxpayer; the same zip eBIRForms writes it with
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
tempfile = "3"
