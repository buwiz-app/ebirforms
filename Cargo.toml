[workspace]
resolver = "2"
members = ["crates/ebirforms-mini-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# Only owner::prepare may be unsafe (it sets the process env before any
# thread starts); everything else stays safe.
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.dependencies]
# eBIRForms' domain crates, pinned by commit (no tags or semver yet). Only
# bir-app-core's BirApp facade is a supported surface; bir-core is reached
# through its re-export.
bir-app-core = { git = "https://github.com/eBIRForms/eBIRForms", rev = "e40954db00e87212cdeb91adadc8e58d8c78ec71" }
# The submission client (device sign-in, device key, sealed sends, receipts),
# at the same commit
bir-submit = { git = "https://github.com/eBIRForms/eBIRForms", rev = "e40954db00e87212cdeb91adadc8e58d8c78ec71" }
# The Buwiz SDK, pinned by commit: the one place this repo names the revision
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "e1de9c4487de6a9b6509e53ed1e990d699cad454" }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
